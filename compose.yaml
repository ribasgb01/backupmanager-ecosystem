services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  silo:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo_data:/data

  server:
    image: backupmanager-server:local
    restart: unless-stopped
    build:
      context: ./backupmanager-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      STORAGE_S3_ENDPOINT: http://silo:9000
      STORAGE_S3_BUCKET_NAME: ${STORAGE_S3_BUCKET_NAME}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}

      API_SECURITY_TOKEN_ACCESS_EXPIRATION: ${API_SECURITY_TOKEN_ACCESS_EXPIRATION}
      API_SECURITY_TOKEN_REFRESH_EXPIRATION: ${API_SECURITY_TOKEN_REFRESH_EXPIRATION}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
      - silo

  frontend:
    image: backupmanager-frontend:local
    restart: unless-stopped
    build:
      context: ./backupmanager-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  silo_data:
